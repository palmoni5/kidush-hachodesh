# צילומי מסך לחנות — הרצה ידנית בלבד (Actions → Store screenshots → Run workflow).
# מריץ את התוסף מהענף הנוכחי ב-Edge ללא ממשק (אותו מנוע כמו WebView2 של
# אוצריא ב-Windows) עם ערכת ברירת המחדל של אוצריא, מצלם כל אחד מטאבי התוסף,
# ומקמט את הצילומים ל-screenshots/. release.yml שולח לחנות את כל
# screenshots/*.png בכל עדכון גרסה, כך שהצילומים יעלו בדחיפה הבאה שמעלה גרסה.
# הקומיט של הוורקר עצמו אינו מפעיל את release.yml (דחיפה ב-GITHUB_TOKEN אינה
# מפעילה וורקרים).
name: Store screenshots

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: store-screenshots
  cancel-in-progress: true

jobs:
  screenshots:
    runs-on: windows-latest   # Edge וגופני Windows — כמו אצל רוב משתמשי אוצריא
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22   # WebSocket מובנה

      - name: צילום
        run: node scripts/store-screenshots/capture.mjs screenshots

      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/

      - name: קומיט
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898733+github-actions[bot]@users.noreply.github.com'
          git add -A screenshots
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { Write-Host 'אין שינוי'; exit 0 }
          git commit -m 'צילומי מסך לחנות'
          git pull --rebase
          git push
