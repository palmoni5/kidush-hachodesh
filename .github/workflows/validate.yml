name: Validate plugin

on:
  pull_request:
    branches: [main]

permissions:
  pull-requests: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Otzaria/otzaria-plugin-validator@v1
        with:
          publish: 'false'
          pr-comment: 'true'
          github-token: ${{ github.token }}
